name: Assistant and Backend CI

on:
  push:
    branches:
      - 'develop/**'
      - 'main'
  pull_request:
    branches:
      - 'develop/**'
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assistant-integrity-and-tests:
    name: Assistant Integrity and Backend Test Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Lint Backend Code
        working-directory: backend
        run: npm run lint

      - name: Run CI Test Matrix (Knowledge Check + Full Test Suite)
        working-directory: backend
        env:
          NODE_ENV: test
          MONGODB_URI: ''
        run: npm run test:ci
