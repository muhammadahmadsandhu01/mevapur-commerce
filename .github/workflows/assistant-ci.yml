name: Assistant and Backend CI

on:
  push:
    branches:
      - 'develop/**'
      - 'main'
  pull_request:
    branches:
      - 'develop/**'
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assistant-integrity-and-tests:
    name: Assistant Integrity and Backend Test Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            admin-panel/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Lint Backend Code
        working-directory: backend
        run: npm run lint

      - name: Run CI Test Matrix (Knowledge Check + Full Test Suite)
        working-directory: backend
        env:
          NODE_ENV: test
          MONGODB_URI: ''
        run: npm run test:ci

      - name: Run Backend Phase 7 Returns, Refunds, Disputes and Reconciliation Tests
        working-directory: backend
        env:
          NODE_ENV: test
          MONGODB_URI: ''
        run: npm run test:phase7

      - name: Run Backend Phase 8 Notifications, Invoices and Exception Tests
        working-directory: backend
        env:
          NODE_ENV: test
          MONGODB_URI: ''
        run: npm run test:phase8

      - name: Run Backend Phase 9 Infrastructure, Health and Rate Limit Tests
        working-directory: backend
        env:
          NODE_ENV: test
          MONGODB_URI: ''
        run: npm run test:phase9

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint Frontend Code
        working-directory: frontend
        run: npm run lint

      - name: Run Storefront Assistant UI Component Tests (Contracts and Real DOM)
        working-directory: frontend
        run: npm run test:assistant

      - name: Run Storefront Category Visibility Tests
        working-directory: frontend
        run: npm run test:categories

      - name: Run Storefront Phase 6C Global Checkout Tests
        working-directory: frontend
        run: |
          node --test tests/phase6cStorefrontCheckout.test.mts
          npx --no-install vitest run tests/phase6cStorefrontCheckout.dom.test.tsx

      - name: Run Storefront Phase 6D-3 Shipping Checkout Tests
        working-directory: frontend
        run: npm run test:phase6d3

      - name: Run Storefront Phase 6D-4 Tax and Customs Checkout Tests
        working-directory: frontend
        run: npm run test:phase6d4

      - name: Run Storefront Phase 8 Customer Recovery Tests
        working-directory: frontend
        run: npm run test:phase8

      - name: Run Storefront Phase 6D-1 Registration and Full Aggregate Test Suite
        working-directory: frontend
        run: npm test

      - name: Build Frontend Application
        working-directory: frontend
        env:
          NEXT_PUBLIC_SITE_NAME: 'HARZAAR'
          NEXT_PUBLIC_SITE_URL: 'https://storefront.mevapur.test'
          NEXT_PUBLIC_API_URL: 'https://api.mevapur.test'
        run: npm run build

      - name: Install Playwright Chromium for Security Smoke Test
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Storefront Post-Build Standalone Server and Security Tests
        working-directory: frontend
        env:
          NEXT_PUBLIC_SITE_NAME: 'HARZAAR'
          NEXT_PUBLIC_SITE_URL: 'https://storefront.mevapur.test'
          NEXT_PUBLIC_API_URL: 'https://api.mevapur.test'
        run: npm run test:postbuild

      - name: Install Admin Panel Dependencies
        working-directory: admin-panel
        run: npm ci

      - name: Lint Admin Panel Code
        working-directory: admin-panel
        run: npm run lint

      - name: Run Admin Panel Assistant UI Component Tests (Contracts and Real DOM)
        working-directory: admin-panel
        run: npm run test:assistant

      - name: Run Admin Category Contract and DOM Tests
        working-directory: admin-panel
        run: npm run test:categories

      - name: Run Admin Phase 6C Commerce Governance Tests
        working-directory: admin-panel
        run: |
          node --test tests/phase6cAdminGovernance.test.mts
          npx --no-install vitest run tests/phase6cAdminGovernance.dom.test.tsx

      - name: Run Admin Phase 6D-3 Shipping Governance Tests
        working-directory: admin-panel
        run: npm run test:phase6d3

      - name: Run Admin Phase 6D-4 Tax and Customs Governance Tests
        working-directory: admin-panel
        run: npm run test:phase6d4

      - name: Run Admin Phase 8 Operations and Exception Tests
        working-directory: admin-panel
        run: npm run test:phase8

      - name: Build Admin Panel Application
        working-directory: admin-panel
        env:
          NEXT_PUBLIC_SITE_NAME: 'HARZAAR Admin'
          NEXT_PUBLIC_ADMIN_URL: 'https://admin.mevapur.test'
          NEXT_PUBLIC_API_URL: 'https://api.mevapur.test'
        run: npm run build

  phase9-infrastructure-ci:
    name: Phase 9 Production Infrastructure and Security Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet

      - name: Pull Pinned Base Images
        run: |
          docker pull node:24.20.0-alpine3.21
          docker pull mongo:7.0.14-jammy
          docker pull redis:7.4.1-alpine3.20
          docker pull nginx:1.27.2-alpine
          docker pull mongodb/mongodb-database-tools:ubuntu2204-100.10.0
          docker pull prom/prometheus:v2.55.1
          docker pull aquasec/trivy:0.56.2

      - name: Validate Prometheus Configuration and Rules
        run: |
          docker run --rm -v ${{ github.workspace }}/docker/monitoring:/etc/prometheus prom/prometheus:v2.55.1 promtool check config /etc/prometheus/prometheus.yml
          docker run --rm -v ${{ github.workspace }}/docker/monitoring:/etc/prometheus prom/prometheus:v2.55.1 promtool check rules /etc/prometheus/alert.rules.yml

      - name: Build Application Container Images
        run: docker compose build

      - name: Run Non-Root User & Image Secret Inspection
        run: |
          docker run --rm mevapur-commerce-backend id -u | grep -E '^1000$' || (echo "Backend container runs as root!" && exit 1)
          docker run --rm mevapur-commerce-frontend id -u | grep -E '^1000$' || (echo "Frontend container runs as root!" && exit 1)
          docker run --rm mevapur-commerce-admin-panel id -u | grep -E '^1000$' || (echo "Admin container runs as root!" && exit 1)

      - name: Run Trivy Vulnerability Scanner on Images
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.56.2 image --severity HIGH,CRITICAL --exit-code 0 mevapur-commerce-backend
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.56.2 image --severity HIGH,CRITICAL --exit-code 0 mevapur-commerce-frontend
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.56.2 image --severity HIGH,CRITICAL --exit-code 0 mevapur-commerce-admin-panel

      - name: Execute Phase 9 Unit and Integration Test Matrix
        working-directory: backend
        run: npm run test:phase9

      - name: Execute A -> B -> A Rollback Rehearsal
        run: node scripts/ops/rehearse-rollback.js --versionA=v1.0.0 --versionB=v1.1.0

      - name: Unconditional Container & Volume Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
